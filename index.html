<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:700;
    letter-spacing:1px;
    box-shadow:0 3px 15px rgba(0,0,0,.4);
}

.container{
    width:95%;
    max-width:1200px;
    margin:35px auto;
}

.player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:18px;
    overflow:hidden;
    background:#000;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.player iframe{
    width:100%;
    height:100%;
    border:none;
}

.loading{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:2;
    transition:.5s;
}

.spinner{
    width:70px;
    height:70px;
    border:7px solid rgba(255,255,255,.2);
    border-top:7px solid #00d4ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.loading p{
    margin-top:20px;
    font-size:18px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.info{
    margin-top:25px;
    background:#161b22;
    padding:25px;
    border-radius:15px;
}

.info h2{
    margin-bottom:12px;
}

.info p{
    color:#c9d1d9;
    line-height:1.7;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    padding:14px 22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.25s;
}

.watch{
    background:#00bfff;
    color:#fff;
}

.watch:hover{
    transform:translateY(-2px);
}

.full{
    background:#2ea043;
    color:white;
}

.full:hover{
    transform:translateY(-2px);
}

footer{
    text-align:center;
    color:#888;
    padding:35px;
}

@media(max-width:700px){

header{
    font-size:22px;
}

.info{
    padding:18px;
}

}
</style>

</head>
<body>

<header>
🎬 Video Player
</header>

<div class="container">

<div class="player">

<div class="loading" id="loading">
<div class="spinner"></div>
<p>Loading video...</p>
</div>

<iframe
id="videoFrame"
src="https://drive.google.com/file/d/1L4f2YgKkZobQbZSr6KVzHOk_ukAopJDy/preview"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

<div class="info">

<h2>Now Playing</h2>

<p>
Enjoy watching the video directly from Google Drive. The player is fully responsive and works on desktop, laptop, tablet, and mobile browsers.
</p>

<div class="buttons">

<button class="watch" onclick="reloadVideo()">
Reload Video
</button>

<button class="full" onclick="fullscreenPlayer()">
Fullscreen
</button>

</div>

</div>

</div>

<footer>
Made with ❤️
</footer>

<script>

const frame=document.getElementById("videoFrame");

frame.onload=function(){
document.getElementById("loading").style.opacity="0";
setTimeout(()=>{
document.getElementById("loading").style.display="none";
},500);
};

function reloadVideo(){
frame.src=frame.src;
document.getElementById("loading").style.display="flex";
document.getElementById("loading").style.opacity="1";
}

function fullscreenPlayer(){
const player=document.querySelector(".player");

if(player.requestFullscreen){
player.requestFullscreen();
}
else if(player.webkitRequestFullscreen){
player.webkitRequestFullscreen();
}
else if(player.msRequestFullscreen){
player.msRequestFullscreen();
}
}

</script>

</body>
</html>
