```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVerse+</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#070707;
color:white;
overflow-x:hidden;
}

body::-webkit-scrollbar{
width:8px;
}

body::-webkit-scrollbar-thumb{
background:#222;
border-radius:30px;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
height:75px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 6%;
background:rgba(0,0,0,.45);
backdrop-filter:blur(30px);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:800;
letter-spacing:2px;
}

.menu{
display:flex;
gap:40px;
}

.menu a{
color:white;
text-decoration:none;
opacity:.8;
transition:.3s;
}

.menu a:hover{
opacity:1;
}

.hero{

height:85vh;

background:
linear-gradient(to top,#070707 5%,rgba(0,0,0,.2) 50%,transparent),
url("https://drive.google.com/thumbnail?id=1GwayuCa0BvWWoqReXjR4En04yFgjeIfG&sz=w2000");

background-size:cover;
background-position:center;

display:flex;
align-items:flex-end;

padding:0 6% 100px;

}

.hero-content{

max-width:700px;

}

.hero h1{

font-size:clamp(55px,9vw,110px);

margin-bottom:20px;

font-weight:800;

}

.hero p{

font-size:18px;

line-height:1.8;

opacity:.8;

margin-bottom:35px;

}

.watch{

background:white;
color:black;

border:none;

padding:18px 42px;

font-size:16px;

font-weight:700;

border-radius:50px;

cursor:pointer;

transition:.3s;

}

.watch:hover{

transform:scale(1.05);

}

section{

padding:60px 6%;

}

.title{

font-size:30px;

margin-bottom:30px;

}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(220px,1fr));

gap:25px;

}

.card{

position:relative;

height:340px;

border-radius:25px;

overflow:hidden;

cursor:pointer;

transition:.4s;

background:#111;

}

.card:hover{

transform:
translateY(-10px)
scale(1.03);

}

.card img{

width:100%;
height:100%;

object-fit:cover;

}

.overlay{

position:absolute;

inset:0;

display:flex;

align-items:flex-end;

padding:20px;

background:

linear-gradient(
to top,
black,
transparent
);

}

.overlay h2{

font-size:25px;

}

footer{

padding:80px;

text-align:center;

opacity:.4;

}

.glow{

position:fixed;

width:500px;
height:500px;

background:#005eff;

border-radius:50%;

filter:blur(200px);

opacity:.15;

pointer-events:none;

}

.mobile-menu{

display:none;

font-size:30px;

}

@media(max-width:768px){

.menu{

display:none;

}

.mobile-menu{

display:block;

}

.hero{

height:70vh;

padding-bottom:60px;

}

.hero p{

font-size:15px;

}

.grid{

grid-template-columns:
repeat(2,1fr);

gap:15px;

}

.card{

height:260px;

}

.title{

font-size:24px;

}

.logo{

font-size:24px;

}

}

</style>
</head>
<body>

<div class="glow"></div>

<nav>

<div class="logo">

STREAMVERSE+

</div>

<div class="menu">

<a href="#">Home</a>
<a href="#">Movies</a>
<a href="#">Trending</a>
<a href="#">Library</a>

</div>

<div class="mobile-menu">

☰

</div>

</nav>



<div class="hero">

<div class="hero-content">

<h1>

OBSESSION

</h1>

<p>

A premium cinematic experience inspired by Apple TV+ and Netflix.

</p>

<button
class="watch"
onclick="location.href='Obsession.html'">

▶ Watch Now

</button>

</div>

</div>



<section>

<h1 class="title">

Trending Now

</h1>

<div class="grid">

<div
class="card"
onclick="location.href='Obsession.html'">

<img
loading="lazy"
src="https://drive.google.com/thumbnail?id=1GwayuCa0BvWWoqReXjR4En04yFgjeIfG&sz=w1000">

<div class="overlay">

<h2>

Obsession

</h2>

</div>

</div>

</div>

</section>



<section>

<h1 class="title">

Recently Added

</h1>

<div class="grid">

<div
class="card"
onclick="location.href='Obsession.html'">

<img
loading="lazy"
src="https://drive.google.com/thumbnail?id=1GwayuCa0BvWWoqReXjR4En04yFgjeIfG&sz=w1000">

<div class="overlay">

<h2>

Obsession

</h2>

</div>

</div>

</div>

</section>



<footer>

StreamVerse+ © 2026

</footer>

<script>

document.addEventListener('mousemove',e=>{

document.querySelector('.glow').style.left=e.clientX-250+'px';

document.querySelector('.glow').style.top=e.clientY-250+'px';

});

</script>

</body>
</html>
```
