```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVerse+</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

body::-webkit-scrollbar{
width:7px;
}

body::-webkit-scrollbar-thumb{
background:#222;
border-radius:20px;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 70px;
background:rgba(0,0,0,.4);
backdrop-filter:blur(30px);
z-index:1000;
}

.logo{
font-size:30px;
font-weight:800;
letter-spacing:2px;
}

.links{
display:flex;
gap:40px;
}

.links a{
color:white;
text-decoration:none;
opacity:.7;
transition:.3s;
}

.links a:hover{
opacity:1;
}

.hero{
height:100vh;
display:flex;
align-items:flex-end;
padding:100px;
background:
linear-gradient(to top,#050505,transparent),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1800")
center/cover;
}

.hero-content{
max-width:700px;
}

.hero h1{
font-size:85px;
font-weight:800;
margin-bottom:20px;
}

.hero p{
opacity:.8;
line-height:1.8;
font-size:18px;
margin-bottom:30px;
}

.buttons{
display:flex;
gap:20px;
}

.play{
background:white;
color:black;
border:none;
padding:18px 40px;
border-radius:50px;
font-weight:700;
cursor:pointer;
}

.info{
background:rgba(255,255,255,.1);
backdrop-filter:blur(30px);
border:none;
color:white;
padding:18px 40px;
border-radius:50px;
cursor:pointer;
}

section{
padding:70px;
}

.title{
font-size:28px;
margin-bottom:30px;
}

.row{
display:flex;
gap:25px;
overflow-x:auto;
padding-bottom:20px;
}

.row::-webkit-scrollbar{
display:none;
}

.card{
min-width:260px;
height:390px;
border-radius:25px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:.5s;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:flex-end;
padding:25px;
background:linear-gradient(to top,black,transparent);
}

.overlay h2{
font-size:22px;
}

.searchBox{
display:flex;
justify-content:center;
padding-top:130px;
}

.search{
width:700px;
padding:20px;
border:none;
outline:none;
border-radius:50px;
background:#121212;
color:white;
font-size:18px;
}

.playerModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:none;
justify-content:center;
align-items:center;
z-index:5000;
}

.playerBox{
width:90%;
max-width:1500px;
}

.close{
position:absolute;
top:30px;
right:50px;
font-size:45px;
cursor:pointer;
}

footer{
padding:100px;
opacity:.4;
text-align:center;
}

.glow{
position:fixed;
width:500px;
height:500px;
background:#0084ff;
filter:blur(200px);
opacity:.15;
border-radius:50%;
pointer-events:none;
}

</style>
</head>

<body>

<div class="glow"></div>

<nav>

<div class="logo">
STREAMVERSE+
</div>

<div class="links">
<a href="">Home</a>
<a href="">Movies</a>
<a href="">Trending</a>
<a href="">Anime</a>
<a href="">Series</a>
</div>

</nav>

<div class="searchBox">

<input
class="search"
placeholder="Search movies...">

</div>

<div class="hero">

<div class="hero-content">

<h1>OBSESSION</h1>

<p>
Enjoy a premium Apple TV+ inspired experience with smooth playback and ultra quality.
</p>

<div class="buttons">

<button
class="play"
onclick="openPlayer()">

▶ Watch Now

</button>

<button class="info">

</button>

</div>

</div>

</div>


<section>

<div class="row">

<img src="https://picsum.photos/400/600?1">

<img src="https://picsum.photos/400/600?4">

<div class="overlay">

<h2>Movie 4</h2>

</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/600?5">

<div class="overlay">

<h2>Movie 5</h2>

</div>

</div>

</div>

</section>

<section>

<h1 class="title">
Recommended
</h1>

<div class="row">

<div class="card">

<img src="https://picsum.photos/400/600?11">

<div class="overlay">

</div>

</div>

<img src="https://picsum.photos/400/600?12">

</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/600?13">

</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/600?14">

<div class="overlay">

</div>

<div class="playerModal"
id="playerModal">

<div class="close"
onclick="closePlayer()">

✕

</div>

<div class="playerBox">

<video
id="player"
playsinline
controls>

<source
src="YOUR_GOOGLE_DRIVE_DIRECT_LINK"

</div>

</div>


<footer>

</footer>


<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>

const player = new Plyr('#player',{

controls:[
'play-large',
'rewind',
'play',
'fast-forward',
'progress',
'current-time',
'duration',
'mute',
'volume',
'settings',
'pip',
'airplay',
'fullscreen'
]

});

function openPlayer(){

document.getElementById(
'playerModal'
).style.display='flex';

}

function closePlayer(){

document.getElementById(
'playerModal'
).style.display='none';

player.pause();

}

document.addEventListener(
'mousemove',
e=>{

document.querySelector(
'.glow'
).style.left=e.clientX-250+'px';

document.querySelector(
'.glow'
).style.top=e.clientY-250+'px';

});

</script>

</body>
</html>
