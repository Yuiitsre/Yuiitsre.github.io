<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12A454" />
<title>Find Jobs — IndustrialLink Worker</title>
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/mobile.css" />
<style>
.job-card {
  background: var(--surface); border-radius: var(--radius-lg);
  border: 1.5px solid var(--border); padding: 16px;
  transition: var(--transition);
}
.job-card:active { transform: scale(0.98); border-color: var(--green); }
.job-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.job-company-icon { width: 44px; height: 44px; border-radius: var(--radius); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.job-company { font-weight: 800; font-size: 0.95rem; }
.job-trade { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
.job-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.job-detail { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--text-secondary); }
.job-footer { display: flex; align-items: center; justify-content: space-between; }
.job-rate { font-size: 1.2rem; font-weight: 900; color: var(--green); }
.job-total { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="portal-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="../index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
        <div class="logo-icon">🔧</div>
        <div><div class="logo-text">IndustrialLink</div><div class="logo-sub">Worker Portal</div></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span> My Dashboard</a>
      <a href="jobs.html" class="nav-item active"><span class="nav-icon">💼</span> Find Jobs <span class="nav-badge">8</span></a>
      <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span> My Profile</a>
      <a href="#" class="nav-item"><span class="nav-icon">💰</span> My Earnings</a>
      <a href="#" class="nav-item"><span class="nav-icon">🔔</span> Job Alerts <span class="nav-badge">3</span></a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar avatar-md avatar-green sidebar-user-initials">RK</div>
      <div><div class="user-name sidebar-user-name">Rajesh Kumar</div><div class="user-role sidebar-user-role">Worker Account</div></div>
      <span class="logout-btn" onclick="logout()">🚪</span>
    </div>
  </aside>

  <main class="portal-main">
    <header class="topbar">
      <button class="topbar-menu-btn" onclick="openSidebar()">☰</button>
      <div>
        <div class="topbar-title">💼 Find Jobs</div>
        <div class="topbar-subtitle">8 new jobs near Ahmedabad</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-notif" onclick="showToast('3 new job alerts!','info')">🔔<div class="notif-dot"></div></div>
      </div>
    </header>

    <div class="portal-content">
      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="jobSearch" placeholder="🔍 Search jobs by company or location..." oninput="searchJobs()" />
        <button onclick="searchJobs()">Search</button>
      </div>

      <!-- Trade filter chips -->
      <div class="chips-row">
        <button class="chip active" onclick="quickFilter('all',this)">All Jobs (12)</button>
        <button class="chip" onclick="quickFilter('tig',this)">🔥 TIG Welder</button>
        <button class="chip" onclick="quickFilter('mig',this)">⚡ MIG Welder</button>
        <button class="chip" onclick="quickFilter('short',this)">⏱️ Short Term</button>
        <button class="chip" onclick="quickFilter('high',this)">💰 High Pay</button>
        <button class="chip" onclick="quickFilter('near',this)">📍 Near Me</button>
      </div>

      <!-- Job results header -->
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:0.78rem;color:var(--text-muted)">Showing <strong id="jobCount">12</strong> jobs</span>
        <select class="form-control" style="width:auto;padding:6px 12px;font-size:0.78rem;min-height:auto">
          <option>Best Match</option><option>Highest Pay</option><option>Longest Duration</option><option>Nearest</option>
        </select>
      </div>

      <!-- Job cards list -->
      <div id="jobsContainer" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </main>
</div>

<!-- Job Detail Modal -->
<div class="modal-overlay" id="jobModal">
  <div class="modal">
    <div class="modal-header"><h3 id="jobModalTitle">Job Details</h3><button class="modal-close">✕</button></div>
    <div class="modal-body" id="jobModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('jobModal')">Cancel</button>
      <button class="btn btn-green" id="jobApplyBtn">✅ Apply for this Job</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="dashboard.html" class="bottom-nav-item"><span class="bottom-nav-icon">🏠</span><span class="bottom-nav-label">Home</span></a>
  <a href="jobs.html" class="bottom-nav-item active"><span class="bottom-nav-icon">💼</span><span class="bottom-nav-label">Find Jobs</span><span class="bottom-nav-badge">8</span></a>
  <a href="profile.html" class="bottom-nav-item"><span class="bottom-nav-icon">👤</span><span class="bottom-nav-label">Profile</span></a>
  <a href="#" class="bottom-nav-item" onclick="showToast('₹24,500 earned','success')"><span class="bottom-nav-icon">💰</span><span class="bottom-nav-label">Earnings</span></a>
  <a href="#" class="bottom-nav-item" onclick="showToast('3 new alerts!','info')"><span class="bottom-nav-icon">🔔</span><span class="bottom-nav-label">Alerts</span><span class="bottom-nav-badge">3</span></a>
</nav>

<div id="toast-container"></div>
<script src="../js/global.js"></script>
<script>
const user = getCurrentUser(); if(user) populateUserInSidebar(user);

const JOBS = [
  { id:1, company:'Godrej Properties', icon:'🏢', trade:'TIG Welder', location:'Gandhinagar, Gujarat', distance:'45 km', days:30, rate:900, skills:['TIG Welding','Structural Steel'], type:'tig', urgent:true },
  { id:2, company:'Adani Ports & SEZ', icon:'⚓', trade:'TIG Welder', location:'Mundra, Gujarat', distance:'280 km', days:45, rate:1000, skills:['TIG Welding','Pipe Welding','Marine'], type:'tig', urgent:true },
  { id:3, company:'ONGC Pipeline', icon:'⛽', trade:'MIG Welder', location:'Surat, Gujarat', distance:'90 km', days:15, rate:850, skills:['MIG Welding','Pipeline Welding'], type:'mig', urgent:false },
  { id:4, company:'Tata Projects', icon:'🏗️', trade:'TIG Welder', location:'Ahmedabad, Gujarat', distance:'8 km', days:60, rate:920, skills:['TIG Welding','Structural','Pressure Vessels'], type:'tig', urgent:false },
  { id:5, company:'ABB India Ltd.', icon:'⚡', trade:'MIG Welder', location:'Vadodara, Gujarat', distance:'110 km', days:90, rate:950, skills:['MIG Welding','Fabrication'], type:'mig', urgent:true },
  { id:6, company:'GSFC Fertilizers', icon:'🏭', trade:'Arc Welder', location:'Baroda, Gujarat', distance:'120 km', days:30, rate:800, skills:['Arc Welding','Pressure Vessels'], type:'mig', urgent:false },
  { id:7, company:'Reliance Industries', icon:'🔵', trade:'TIG Welder', location:'Jamnagar, Gujarat', distance:'340 km', days:6, rate:1200, skills:['TIG Welding','High-Pressure Pipe'], type:'tig', urgent:true },
  { id:8, company:'Sun Pharma', icon:'💊', trade:'TIG Welder', location:'Ahmedabad, Gujarat', distance:'12 km', days:20, rate:900, skills:['TIG Welding','Sanitary Welding','GMP'], type:'tig', urgent:false },
];

let currentJobId = null;

function renderJobs(jobs) {
  document.getElementById('jobCount').textContent = jobs.length;
  const container = document.getElementById('jobsContainer');
  if (!jobs.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">💼</div><h3>No jobs found</h3><p>Try different filters</p></div>'; return; }
  container.innerHTML = jobs.map(j => `
    <div class="job-card fade-in">
      <div class="job-header">
        <div class="job-company-icon">${j.icon}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div class="job-company">${j.company}</div>
            ${j.urgent ? '<span class="badge badge-red" style="font-size:0.65rem">🔥 Urgent</span>' : ''}
          </div>
          <div class="job-trade">${j.trade} · ${j.days} days</div>
        </div>
      </div>
      <div class="job-details">
        <div class="job-detail">📍 ${j.location}</div>
        <div class="job-detail">🚗 ${j.distance} away</div>
        <div class="job-detail">📅 ${j.days} days contract</div>
        <div class="job-detail">💼 ${j.skills[0]}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">
        ${j.skills.map(s=>`<span class="chip" style="cursor:default;font-size:0.7rem;padding:4px 10px;min-height:auto">${s}</span>`).join('')}
      </div>
      <div class="job-footer">
        <div>
          <div class="job-rate">₹${j.rate}/day</div>
          <div class="job-total">Total: ₹${(j.rate*j.days).toLocaleString('en-IN')}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="viewJob(${j.id})">Details</button>
          <button class="btn btn-green btn-sm" onclick="applyDirectly(${j.id})">Apply Now</button>
        </div>
      </div>
    </div>
  `).join('');
}

function viewJob(id) {
  const j = JOBS.find(x => x.id === id);
  if (!j) return;
  currentJobId = id;
  document.getElementById('jobModalTitle').textContent = j.icon + ' ' + j.company;
  document.getElementById('jobModalBody').innerHTML = `
    <div style="background:var(--green-light);border-radius:var(--radius);padding:14px">
      <div style="font-size:1.5rem;font-weight:900;color:var(--green)">₹${j.rate}/day</div>
      <div style="font-size:0.78rem;color:var(--green);margin-top:2px">Total: ₹${(j.rate*j.days).toLocaleString('en-IN')} for ${j.days} days</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:var(--radius);padding:14px">
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>🏢</span><span>${j.company}</span></div>
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>🔧</span><span>${j.trade}</span></div>
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>📍</span><span>${j.location} (${j.distance})</span></div>
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>📅</span><span>${j.days} days · Starting soon</span></div>
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>💳</span><span>Daily UPI payment · Same evening</span></div>
      <div style="font-size:0.82rem;color:var(--text-secondary);display:flex;gap:8px"><span>🛡️</span><span>Accident insurance included</span></div>
    </div>
    <div><div style="font-size:0.8rem;font-weight:700;margin-bottom:8px">Skills Required</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">${j.skills.map(s=>`<span class="chip" style="cursor:default">${s}</span>`).join('')}</div></div>
  `;
  document.getElementById('jobApplyBtn').onclick = () => applyJob(id);
  openModal('jobModal');
}
function applyJob(id) {
  const j = JOBS.find(x => x.id === id);
  closeModal('jobModal');
  showToast(`✅ Applied to ${j.company}! They'll confirm within 1 hour.`, 'success', 4000);
}
function applyDirectly(id) {
  const j = JOBS.find(x => x.id === id);
  showToast(`✅ Applied to ${j.company}! ₹${j.rate}/day · ${j.days} days`, 'success', 4000);
}
function quickFilter(type, btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); btn.classList.add('active');
  let f = JOBS;
  if (type === 'tig') f = JOBS.filter(j => j.type === 'tig');
  else if (type === 'mig') f = JOBS.filter(j => j.type === 'mig');
  else if (type === 'short') f = JOBS.filter(j => j.days <= 20);
  else if (type === 'high') f = JOBS.filter(j => j.rate >= 900);
  else if (type === 'near') f = JOBS.filter(j => parseInt(j.distance) < 100);
  renderJobs(f);
}
function searchJobs() {
  const q = document.getElementById('jobSearch').value.toLowerCase();
  renderJobs(q ? JOBS.filter(j => j.company.toLowerCase().includes(q) || j.location.toLowerCase().includes(q) || j.trade.toLowerCase().includes(q)) : JOBS);
}
renderJobs(JOBS);
</script>
</body>
</html>
